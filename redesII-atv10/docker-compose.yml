services:

  users-service:
    build: ./users-service
    ports:
      - "3001:3000"
    depends_on:
      - rabbitmq

  products-service:
    build: ./products-service
    ports:
      - "3002:3000"
    depends_on:
      - rabbitmq

  orders-service:
    build: ./orders-service
    ports:
      - "3003:3000"
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  consul:
    image: hashicorp/consul:1.15
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"